[General]
Enabled=1

[LightSuppression]
; Event-driven no-light list. No scene scan, periodic pass, or proximity search.
; Deathbell covers TreeFloraDeathBell01 [000BB94B], TreeFloraDeathBell02 [000BB94C],
; and HearthFires BYOHHouseIngrdDeathbell01 [03010462].
; 1 vetoes new lights at CreatePointLight and, if an already-live NiLight reaches
; the existing ISL ProcessLight path, zeroes/drops that payload and marks the
; NiLight hidden + Disabled so Open Shaders rejects it on later passes.
; This section is intentionally extensible for future exact-owner offenders.
Deathbell=1

[InverseSquare]
; Maximum outer radius for ordinary local lights. 0 disables the ordinary global cap.
; Disabled by default because the broad radius reducer can distort authored lighting.
; Dedicated MagicHandLights/MagicImpactLights caps remain independent.
; Environmental lights matched by the global EditorID whitelist bypass this cap when it is enabled.
MaxRadius=0

; Applies only to ordinary lights that are actually reduced by MaxRadius.
; Fraction of the capped radius where the explicit smooth fade begins.
; 0.10 = begin at 10% radius, then fade gradually through the remaining 90%.
; The inverse-square attenuation itself still starts immediately at the source.
FadeStartFraction=0.10

[EnvironmentalWhitelist]
Enabled=1
; Case-insensitive EditorID substrings.
Keywords=Sunlight,SunBounce,FakeSun,FakeWindow,FakeMoon,NightLight

; Exact load-order-independent environmental exceptions.
; Syntax: PluginName.esp|LocalFormID,Other.esl|0ABC
; Use the plugin-relative FormID shown in xEdit, not the runtime/load-order-prefixed FormID.
; Example for the Project AHO farm test:
; Forms=Lux.esp|00280E41
Forms=

; Force-cap keyword matches override both Keywords and Forms.
ForceCapKeywords=

[MagicHandLights]
; Primary AND match plus narrow exceptions. Vanilla Conjuration's casting light
; is MagicLightSummon01 and does not contain the word "Hand", so test20 adds
; MagicLightSummon as an OR fallback plus exact vanilla forms.
; Forms syntax is Plugin|LocalFormID and is load-order independent.
Enabled=1
RequiredKeywords=Magic,Hand
AnyKeywords=MagicLightSummon
Forms=Skyrim.esm|0003BA90,Skyrim.esm|00075347
MaxRadius=40.0
CastShadows=0
[MagicImpactLights]
; HAZD->LIGH remains the structural impact/hazard rule. The MAG+Impact AND
; fallback is retained, with narrow OR/exact escape hatches for custom lights.
; Impact illumination is intentionally very local: 20 units by default.
; Shadows are otherwise unchanged.
Enabled=1
RequiredKeywords=MAG,Impact
AnyKeywords=SpellImpact,MagicImpact
Forms=
MaxRadius=20.0
[Shadows]
; Open Shaders shadow-add path. Global ISL keeps normal-light promotion available,
; while the continuous-spell limiter below can reject only excess rapid dynamic
; spell/breath lights before they become full shadow casters.
ForcePromoteNormalLights=1

[ShadowBiasCorrection]
; Caps only local point/spot LIGHT_CREATE_PARAMS depth bias at the existing
; ShadowSceneNode::AddLight path. No second scanner or per-frame rewrite.
; Existing/native shadow casters are included even when they need no ISL conversion.
; Values already at or below MaximumBias are left untouched. Sun/moon directional
; shadows use a separate engine path and are not modified.
Enabled=1
MaximumBias=1.0

[ContinuousSpellShadows]
; Event-driven spray/concentration optimization. No world/cell scan is added.
; A dynamic light definition must be created BurstThreshold times inside
; BurstWindowMs before it is treated as a continuous stream. One-shot projectiles
; such as fireballs/shadow balls therefore keep their existing full shadow behavior.
Enabled=1
BurstWindowMs=250
BurstThreshold=4

; Once classified as a continuous stream, allow at most one NEW promoted shadow
; light per interval. All other stream lights still illuminate and remain ISL; only
; their expensive normal->shadow promotion is skipped. 125 ms = up to 8 moving
; shadow representatives per second, deliberately conservative for visual quality.
ShadowIntervalMs=125

; Keep the classification alive while the stream continues, then forget it quickly.
HoldMs=1200

[Debug]
EnableLogging=0

[FireColor]
; Applies one consistent fire chromaticity only to classified fire-family engine lights.
; Engine lights are classified by TESObjectLIGH provenance. In Authoritative mode the colour is
; reasserted on transient LightData after ProcessLight, after Effects11 where resolved, and again at
; clustered submission, so later Open Shaders point-light colour processing cannot repaint it.
; Generated Open Shaders particle lights
; can optionally inherit the fire color only when they are spatially paired to a classified fire light.
Enabled=1

; Case-insensitive OR-match against TESObjectLIGH EditorID.
; Covers vanilla/Lux naming including Lux's common "Bazier" spelling.
Keywords=Candle,Torch,Fire,Firepit,Fireplace,Brazier,Bazier,Ember,Forge,Hearth,Campfire,Lantern,Chandelier,Candelabre,Sconce,FakeFlicker

; Any match here vetoes the keyword rule so magic/cold/sun-family lights stay authored.
ExcludeKeywords=Magic,Spell,Projectile,Impact,Cold,Blue,Frost,Shock,Sunlight,SunBounce,FakeSun,FakeWindow,FakeMoon,NightLight

; Exact load-order-independent additions for unusual fire lights that lack useful EditorIDs.
; Syntax: PluginName.esp|LocalFormID,Other.esl|0ABC
Forms=

; Fixed fire RGB in ordinary 0-255 values. Defaults to the warm MLO2-style fire orange,
; but now only genuine fire-family lights receive it.
Red=255
Green=140
Blue=60

; 1 keeps each light's existing intensity while forcing the same RGB ratio.
; 0 writes the exact normalized RGB above, which can change perceived brightness.
PreserveIntensity=1

; Reassert fire chromaticity after Open Shaders ProcessLight and, when present,
; after Effects11 PointLightingCurve/Desaturation/Intensity. This is the authoritative
; layer that prevents renderer/preset post-processing from repainting classified fire lights.
Authoritative=1

; Safety gate for EditorID-based fire matches. 1 only recolours a named fire light
; when its authored RGB is already warm. This prevents special blue/neutral
; lights with names such as NocturnalFire or DwemerLantern from being forced orange.
; Exact FireColor.Forms entries bypass this check.
RequireWarm=1

; Pair Open Shaders generated Simple particle/source lights to classified fire lights
; from the same current light batch. No scene scan or retained engine pointers are used.
PairParticleLights=1

; Maximum camera-relative separation (Skyrim units) between a classified fire
; engine light and a generated particle light for color inheritance.
ParticlePairDistance=128.0

; Extra safety filter: paired generated lights must already be in the warm yellow-to-orange
; family. This prevents nearby blue/cold/neutral particle lights from becoming orange.
ParticleRequireWarm=1

; Conservative detached engine-bulb pairing for lighting mods such as Lux.
; The plugin scans placed references in the owning plugin and pairs each recognized
; local fire-source STAT/MSTT reference with only its single nearest eligible warm
; local LIGH reference in the same cell. The match is per placed reference, not per
; LIGH definition, so a shared Lux bulb can still be used elsewhere unchanged.
PairDetachedEngineBulbs=1

; Maximum source-to-bulb separation for the detached engine-light association.
DetachedPairDistance=128.0

; Require the authored LIGH colour to already be warm before it can be paired.
DetachedRequireWarm=1
