name: Publish mod-manager prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CLANG_CL: clang-19
      LLD_LINK: lld-link-19
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install build and release tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git clang-19 lld-19 g++ python3 gh

      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
          version=$(head -n 1 GlobalPointLightISL.cpp | awk '{print $NF}')
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$version.md"

      - name: Test, analyze, build, and verify reproducibility
        run: ./scripts/check.sh

      - name: Prepare exact corresponding source and checksums
        run: |
          version=$(head -n 1 GlobalPointLightISL.cpp | awk '{print $NF}')
          git -C "$GITHUB_WORKSPACE" diff --exit-code HEAD --
          git archive --format=zip --prefix="GlobalPointLightISL-$version-source/" \
            --output="build/GlobalPointLightISL-$version-source.zip" HEAD
          cd build
          sha256sum "GlobalPointLightISL-$version-source.zip" > "GlobalPointLightISL-$version-source.zip.sha256"
          sha256sum --check ./*.zip.sha256

      - name: Publish verified assets as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(head -n 1 GlobalPointLightISL.cpp | awk '{print $NF}')
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "Global Point Light ISL $version" \
            --notes-file "docs/releases/$version.md" \
            "build/GlobalPointLightISL-$version.zip" \
            "build/GlobalPointLightISL-$version.zip.sha256" \
            "build/GlobalPointLightISL-$version-source.zip" \
            "build/GlobalPointLightISL-$version-source.zip.sha256"
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
