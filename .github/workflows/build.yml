name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    env:
      CLANG_CL: clang-19
      LLD_LINK: lld-link-19
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install LLVM 19 and build prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git clang-19 lld-19 python3

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build, verify PE, and package
        run: ./scripts/package.sh

      - name: Check reproducibility in a second build directory
        run: |
          BUILD_DIR="$PWD/build-repro" ./scripts/package.sh
          cmp build/GlobalPointLightISL.dll build-repro/GlobalPointLightISL.dll
          for archive in build/*.zip; do
            cmp "$archive" "build-repro/$(basename "$archive")"
          done
          cd build
          sha256sum --check ./*.zip.sha256

      - name: Ensure the build preserved tracked files
        run: git diff --exit-code

      - name: Upload installable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GlobalPointLightISL-${{ github.sha }}
          path: |
            build/GlobalPointLightISL-*.zip
            build/GlobalPointLightISL-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
