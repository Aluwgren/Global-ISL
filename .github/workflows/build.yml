name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    env:
      CLANG_CL: clang-19
      LLD_LINK: lld-link-19
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install LLVM 19 and build prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git clang-19 lld-19 g++ python3

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree

      - name: Test, analyze, build, and verify reproducibility
        run: ./scripts/check.sh

      - name: Ensure the build preserved tracked files
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code HEAD --

      - name: Upload installable package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GlobalPointLightISL-${{ github.sha }}
          path: |
            build/GlobalPointLightISL-*.zip
            build/GlobalPointLightISL-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
